<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d1c">
<title>Silph Relay — Feed Analytics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
/* ===== Observation Deck design tokens ===== */
:root {
  color-scheme: dark;

  /* surfaces */
  --bg: #0a0d1c;
  --bg-raised: #10142e;
  --card: #12163a;
  --card-chrome: #0c0f26;
  --border: rgba(255, 255, 255, 0.09);
  --border-hover: rgba(255, 154, 68, 0.55);

  /* text */
  --text: #e8eaf6;
  --muted: #9ba1c5;
  --faint: #7b81aa;

  /* accents */
  --accent: #ff9a44;
  --accent-deep: #e8792b;
  --magenta: #c23e8c;

  /* semantic */
  --live: #3ddc84;
  --warn: #ffc24b;
  --down: #ff6b6b;
  --series-blue: #5b8def;
  --grid: rgba(255, 255, 255, 0.07);
  --fill-accent: rgba(255, 154, 68, 0.12);

  /* components */
  --tag-bg: rgba(255, 154, 68, 0.10);
  --tag-text: #ffb877;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  --btn-ink: #0a0d1c;

  /* type */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* shape */
  --radius-card: 12px;
  --radius-control: 8px;
  --radius-pill: 999px;

  /* categorical series — deck order: accent, blue, live, magenta, warn, down.
     Bound to account identity, never to rank, so filtering never repaints. */
  --s1: var(--accent);
  --s2: var(--series-blue);
  --s3: var(--live);
  --s4: var(--magenta);
  --s5: var(--warn);
  --s6: var(--down);
  --s-other: var(--faint);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(900px 480px at 15% -10%, rgba(232, 121, 43, 0.10), transparent 60%),
    radial-gradient(800px 480px at 90% 0%, rgba(194, 62, 140, 0.09), transparent 60%);
}
::selection { background: var(--accent-deep); color: var(--btn-ink); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-deep); }
a:focus-visible, button:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
@keyframes deck-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== layout ===== */
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
.kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 6px;
}
.kicker a { color: var(--faint); }
.kicker a:hover { color: var(--accent); }
h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 68ch; }

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}
.panel__head {
  background: var(--card-chrome);
  border-bottom: 1px solid var(--border);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.panel__title {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}
.panel__note { font-size: 12px; color: var(--faint); }
.panel__body { padding: 16px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

/* ===== chips ===== */
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--bg-raised);
  color: var(--muted);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.chip.ok { color: var(--live); }
.chip.ok .dot { background: var(--live); box-shadow: 0 0 8px var(--live); animation: deck-pulse 2.4s ease-in-out infinite; }
.chip.warn { color: var(--warn); } .chip.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.chip.down { color: var(--down); } .chip.down .dot { background: var(--down); box-shadow: 0 0 8px var(--down); }
.chip b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

/* ===== controls ===== */
.controls {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.seg {
  display: inline-flex; border: 1px solid var(--border);
  border-radius: var(--radius-control); overflow: hidden; background: var(--bg-raised);
}
.seg button {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: none; cursor: pointer;
  padding: 8px 14px; transition: background 0.2s ease, color 0.2s ease;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--btn-ink); font-weight: 600; }
.btn {
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  color: var(--text); background: var(--bg-raised);
  border: 1px solid var(--border); border-radius: var(--radius-control);
  padding: 8px 14px; cursor: pointer;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.btn:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.spacer { flex: 1 1 auto; }

/* ===== stat tiles ===== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-control); padding: 12px 14px;
}
.stat .label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint);
}
.stat .value { font-size: 22px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--muted); }
.stat .delta.up { color: var(--live); } .stat .delta.down { color: var(--down); }

/* ===== legend ===== */
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button {
  display: inline-flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-pill);
  padding: 4px 10px 4px 8px; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); transition: border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
}
.legend button:hover { border-color: var(--border-hover); color: var(--text); }
.legend button[aria-pressed="false"] { opacity: 0.4; }
.legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* ===== charts ===== */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--faint); letter-spacing: 0.04em; }
.chart .axis-line { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .val-label { fill: var(--text); font-variant-numeric: tabular-nums; }
.chart .bucket-hit { fill: transparent; cursor: pointer; }
.chart .bucket-hit:hover { fill: rgba(255,255,255,0.04); }
.chart .bucket-hit.is-sel { fill: var(--fill-accent); }
.seg-rect { transition: opacity 0.2s ease; }

.tooltip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transform: translate(-50%, calc(-100% - 12px));
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-control); box-shadow: var(--shadow);
  padding: 9px 11px; min-width: 140px; transition: opacity 0.12s ease;
}
.tooltip.show { opacity: 1; }
.tooltip .tt-head {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 5px;
}
.tooltip .tt-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.tooltip .tt-row .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tooltip .tt-row b { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; }
.tooltip .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 5px; }

/* ===== heatmap ===== */
.heat-cell { stroke: var(--card); stroke-width: 2; }
.heat-scale { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.heat-scale .ramp { display: flex; gap: 2px; }
.heat-scale .ramp i { width: 16px; height: 10px; border-radius: 2px; display: block; }

/* ===== table ===== */
table { width: 100%; border-collapse: collapse; }
th {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--faint); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 500;
}
td { font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--muted); }
tbody tr:hover td { background: var(--bg-raised); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.name { color: var(--text); }
td .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 8px; }
tfoot td { color: var(--text); font-weight: 650; border-bottom: none; }

.msg { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.msg code { font-family: var(--font-mono); font-size: 12px; color: var(--faint); }

footer {
  border-top: 1px solid var(--border); margin-top: 26px; padding-top: 16px;
  text-align: center; font-size: 13px; color: var(--faint);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="kicker"><a href="https://observation-deck.netlify.app/">Observation Deck</a> / Silph Relay</div>
  <h1>Feed Analytics</h1>
  <p class="lede">
    How often each tracked X account posts, and how quickly those posts reach Discord.
  </p>

  <div class="chiprow" id="chiprow">
    <span class="chip"><span class="dot"></span> Loading…</span>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Time period">
      <button id="btn-week" aria-pressed="true">Weekly</button>
      <button id="btn-month" aria-pressed="false">Monthly</button>
      <button id="btn-all" aria-pressed="false">All time</button>
    </div>
    <span class="panel__note" id="sel-note"></span>
    <span class="spacer"></span>
    <button class="btn" id="btn-refresh">↻ Refresh</button>
  </div>

  <div class="stats" id="stats"></div>

  <section class="panel">
    <div class="panel__head">
      <span class="panel__title">Posts over time</span>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel__body">
      <div id="chart-time"><div class="msg">Loading data…</div></div>
      <p class="panel__note" id="coverage-note" style="margin:12px 0 0"></p>
    </div>
  </section>

  <div class="grid-2">
    <section class="panel">
      <div class="panel__head">
        <span class="panel__title">By account</span>
        <span class="panel__note" id="acct-note"></span>
      </div>
      <div class="panel__body"><div id="chart-accounts"></div></div>
    </section>

    <section class="panel">
      <div class="panel__head">
        <span class="panel__title">Activity by hour</span>
        <span class="panel__note">local time</span>
      </div>
      <div class="panel__body"><div id="chart-heat"></div></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel__head">
      <span class="panel__title">Table view</span>
      <span class="panel__note" id="table-note"></span>
    </div>
    <div class="panel__body" style="overflow-x:auto"><div id="table"></div></div>
  </section>

  <section class="panel">
    <div class="panel__head">
      <span class="panel__title">Post log</span>
      <span class="panel__note" id="log-note"></span>
    </div>
    <div class="panel__body" style="overflow-x:auto"><div id="log"></div></div>
  </section>

  <footer>
    <a href="https://observation-deck.netlify.app/">Observation Deck</a> ·
    JS ·
    <a href="https://github.com/00xJS/silph-relay">GitHub</a>
  </footer>
</div>

<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- config
  const REPO = "00xJS/silph-relay";
  const DATA_URL = `https://raw.githubusercontent.com/${REPO}/main/data/seen_ids.json`;
  const DELIVERIES_URL = `https://raw.githubusercontent.com/${REPO}/main/data/deliveries.json`;
  const LOG_URL = `https://raw.githubusercontent.com/${REPO}/main/data/recent_posts.json`;
  const SNOWFLAKE_EPOCH = 1288834974657n;   // X's snowflake epoch
  const AUTO_REFRESH_MS = 5 * 60 * 1000;

  // Colour is bound to the account, never to rank or position, so hiding a
  // series never repaints the survivors. Deck series order.
  const ACCOUNTS = [
    { key: "pokemongoapp",    label: "@PokemonGoApp",    slot: "--s1", channel: "Pokémon GO" },
    { key: "leekduck",        label: "@LeekDuck",        slot: "--s2", channel: "Pokémon GO" },
    { key: "thepokemodgroup", label: "@thepokemodgroup", slot: "--s3", channel: "Pokémon GO" },
    { key: "scopelyexplore",  label: "@ScopelyExplore",  slot: "--s4", channel: "Pokémon GO" },
    { key: "pokemonrestocks", label: "@pokemonrestocks", slot: "--s5", channel: "TCG restocks" },
    { key: "pokemondealstcg", label: "@PokemonDealsTCG", slot: "--s6", channel: "TCG restocks" },
  ];
  // Posts whose author isn't one of the tracked accounts — almost always a
  // repost the relay picked up before the log recorded who surfaced it.
  const OTHER = { key: "__other", label: "Other authors", slot: "--s-other", channel: "reposts" };

  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const colorOf = (acct) => cssVar(acct.slot);

  /** "#rrggbb" -> "r, g, b" so ramps can be built from the theme token itself. */
  function rgbChannels(hex) {
    const h = hex.replace("#", "").trim();
    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const n = parseInt(full.slice(0, 6), 16);
    return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
  }
  const EMPTY_CELL = "rgba(255, 255, 255, 0.035)";
  const heatFill = (alpha) => `rgba(${rgbChannels(cssVar("--accent"))}, ${alpha})`;

  // ---------------------------------------------------------------- state
  const state = {
    posts: [],            // { ts: Date, acct, id }
    deliveries: new Map(),// status id -> delivery time (ms), recorded by the relay
    log: new Map(),       // status id -> { acct, text, url, delivered, img?, author? }
    scope: "week",        // "week" | "month" | "all" — what every panel reports on
    granularity: "week",  // timeline bucket size: "week" | "month" ("all" buckets monthly)
    hidden: new Set(),    // account keys hidden via legend
    selected: null,       // focused bucket key; null means the whole span
    pinned: false,        // true once the user picks a period by hand
    fetchedAt: null,
    error: null,
  };

  // ---------------------------------------------------------------- data
  // Tweet IDs are snowflakes: the creation time is encoded in the high bits.
  // IDs exceed Number.MAX_SAFE_INTEGER, so parse with BigInt.
  function timestampFromId(id) {
    return Number((BigInt(id) >> 22n) + SNOWFLAKE_EPOCH);
  }

  const URL_RE = /(?:twitter|x)\.com\/([^/]+)\/status(?:es)?\/(\d+)/i;

  function parse(rawIds, log) {
    const byKey = new Map(ACCOUNTS.map((a) => [a.key, a]));
    const out = [];
    for (const raw of rawIds) {
      const m = URL_RE.exec(String(raw));
      if (!m) continue;
      const ms = timestampFromId(m[2]);
      if (!Number.isFinite(ms) || ms < 1e12) continue;

      // The log knows which tracked account surfaced the post; the URL only
      // names the author, which is wrong for reposts. Prefer the log.
      const logged = log && log.get(m[2]);
      const acct =
        (logged && byKey.get(String(logged.acct).toLowerCase())) ||
        byKey.get(m[1].toLowerCase()) ||
        OTHER;

      out.push({ ts: new Date(ms), acct, id: m[2] });
    }
    out.sort((a, b) => a.ts - b.ts);
    return out;
  }

  async function load({ bustCache = false } = {}) {
    const bust = (u) => (bustCache ? `${u}?t=${Date.now()}` : u);
    const opts = { cache: bustCache ? "reload" : "default" };

    const [idsRes, delRes, logRes] = await Promise.all([
      fetch(bust(DATA_URL), opts),
      // These two are nice-to-haves — a failure must not blank the page
      fetch(bust(DELIVERIES_URL), opts).catch(() => null),
      fetch(bust(LOG_URL), opts).catch(() => null),
    ]);

    if (!idsRes.ok) throw new Error(`GitHub returned HTTP ${idsRes.status}`);
    const ids = await idsRes.json();
    if (!Array.isArray(ids)) throw new Error("Unexpected data shape");

    let deliveries = new Map();
    if (delRes && delRes.ok) {
      try {
        const rows = await delRes.json();
        if (Array.isArray(rows)) {
          deliveries = new Map(
            rows.filter((r) => Array.isArray(r) && r.length === 2).map((r) => [String(r[0]), Number(r[1]) * 1000])
          );
        }
      } catch { /* leave empty — the tile degrades to "—" */ }
    }

    let log = new Map();
    if (logRes && logRes.ok) {
      try {
        const rows = await logRes.json();
        if (Array.isArray(rows)) {
          log = new Map(rows.filter((r) => r && r.id).map((r) => [String(r.id), r]));
        }
      } catch { /* the log panel degrades to a message */ }
    }
    return { posts: parse(ids, log), deliveries, log };
  }

  // ---------------------------------------------------------------- buckets
  const startOfWeek = (d) => {           // weeks start Monday, local time
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  };
  const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const bucketStart = (d) => (state.granularity === "week" ? startOfWeek(d) : startOfMonth(d));
  const bucketKey = (d) => bucketStart(d).toISOString().slice(0, 10);

  const fmtBucket = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    return state.granularity === "week"
      ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      : d.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
  };
  const fmtBucketLong = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    if (state.granularity === "month") return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const end = new Date(d); end.setDate(end.getDate() + 6);
    const o = { month: "short", day: "numeric" };
    return `Week of ${d.toLocaleDateString(undefined, o)} – ${end.toLocaleDateString(undefined, o)}`;
  };

  const visibleAccounts = () => [...ACCOUNTS, OTHER].filter(
    (a) => !state.hidden.has(a.key) && state.posts.some((p) => p.acct.key === a.key)
  );

  /** Build an ordered list of buckets, gap-filled so empty periods still show. */
  function buildBuckets() {
    if (!state.posts.length) return [];
    const counts = new Map();
    for (const p of state.posts) {
      if (state.hidden.has(p.acct.key)) continue;
      const k = bucketKey(p.ts);
      if (!counts.has(k)) counts.set(k, new Map());
      const m = counts.get(k);
      m.set(p.acct.key, (m.get(p.acct.key) || 0) + 1);
    }
    const first = bucketStart(state.posts[0].ts);
    const last = bucketStart(state.posts[state.posts.length - 1].ts);
    const out = [];
    const cur = new Date(first);
    while (cur <= last && out.length < 400) {
      const k = cur.toISOString().slice(0, 10);
      const m = counts.get(k) || new Map();
      out.push({ key: k, counts: m, total: [...m.values()].reduce((a, b) => a + b, 0) });
      if (state.granularity === "week") cur.setDate(cur.getDate() + 7);
      else cur.setMonth(cur.getMonth() + 1);
    }
    return out;
  }

  /** Bucket key of the most recent period that exists in the data. */
  function latestBucketKey() {
    if (!state.posts.length) return null;
    return bucketKey(state.posts[state.posts.length - 1].ts);
  }

  /** The bucket immediately before `key` (same granularity). */
  function prevBucketKey(key) {
    const d = new Date(key + "T00:00:00");
    if (state.granularity === "week") d.setDate(d.getDate() - 7);
    else d.setMonth(d.getMonth() - 1);
    return d.toISOString().slice(0, 10);
  }

  /** Days elapsed inside the reported period — never counts the future. */
  function periodDays() {
    const now = Date.now();
    if (!state.selected) {
      const first = state.posts[0].ts.getTime();
      return Math.max(1, Math.ceil((Math.min(now, state.posts[state.posts.length - 1].ts.getTime()) - first) / 864e5));
    }
    const start = new Date(state.selected + "T00:00:00");
    const end = new Date(start);
    if (state.granularity === "week") end.setDate(end.getDate() + 7);
    else end.setMonth(end.getMonth() + 1);
    return Math.max(1, Math.ceil((Math.min(now, end.getTime()) - start.getTime()) / 864e5));
  }

  /** Earliest post per account — a proxy for when the relay started tracking it. */
  function firstSeen() {
    const m = new Map();
    for (const p of state.posts) {
      if (!m.has(p.acct.key) || p.ts < m.get(p.acct.key)) m.set(p.acct.key, p.ts);
    }
    return m;
  }

  /** Posts inside the current selection (a bucket, or everything). */
  function selectedPosts() {
    return state.posts.filter(
      (p) => !state.hidden.has(p.acct.key) && (!state.selected || bucketKey(p.ts) === state.selected)
    );
  }

  // ---------------------------------------------------------------- tooltip
  const tooltipEl = document.getElementById("tooltip");
  function showTooltip(evt, html) {
    tooltipEl.innerHTML = html;
    tooltipEl.style.left = `${evt.clientX}px`;
    tooltipEl.style.top = `${evt.clientY}px`;
    tooltipEl.classList.add("show");
  }
  const hideTooltip = () => tooltipEl.classList.remove("show");

  const svgEl = (name, attrs = {}) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  };

  /** Nice-ish axis maximum + step for a small integer range. */
  function niceScale(max) {
    if (max <= 0) return { max: 1, step: 1 };
    const raw = max / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || mag * 10;
    return { max: Math.ceil(max / step) * step, step };
  }

  // ---------------------------------------------------------------- charts
  function renderTimeline() {
    const host = document.getElementById("chart-time");
    host.innerHTML = "";
    const buckets = buildBuckets();
    const accts = visibleAccounts();
    if (!buckets.length || !accts.length) {
      host.innerHTML = `<div class="msg">No posts in this view.</div>`;
      return;
    }

    const W = Math.max(host.clientWidth || 800, 320);
    const H = 260;
    const M = { top: 14, right: 8, bottom: 30, left: 38 };
    const plotW = W - M.left - M.right;
    const plotH = H - M.top - M.bottom;

    const peak = Math.max(...buckets.map((b) => b.total), 1);
    const { max: yMax, step } = niceScale(peak);
    const y = (v) => M.top + plotH - (v / yMax) * plotH;

    const slotW = plotW / buckets.length;
    const barW = Math.max(3, Math.min(slotW - 6, 46));

    const svg = svgEl("svg", {
      class: "chart", viewBox: `0 0 ${W} ${H}`, width: "100%", height: H,
      role: "img", "aria-label": "Stacked column chart of posts per period by account",
    });

    // gridlines + y ticks (recessive)
    for (let v = 0; v <= yMax; v += step) {
      svg.appendChild(svgEl("line", { class: v === 0 ? "axis-line" : "grid-line", x1: M.left, x2: W - M.right, y1: y(v), y2: y(v) }));
      const t = svgEl("text", { x: M.left - 8, y: y(v) + 3, "text-anchor": "end" });
      t.textContent = v;
      svg.appendChild(t);
    }

    // x labels — thinned so they never collide
    const everyN = Math.max(1, Math.ceil(buckets.length / Math.floor(plotW / 58)));
    buckets.forEach((b, i) => {
      if (i % everyN !== 0 && i !== buckets.length - 1) return;
      const t = svgEl("text", { x: M.left + i * slotW + slotW / 2, y: H - 10, "text-anchor": "middle" });
      t.textContent = fmtBucket(b.key);
      svg.appendChild(t);
    });

    buckets.forEach((b, i) => {
      const cx = M.left + i * slotW + slotW / 2;

      // click/hover target spanning the full column height
      const hit = svgEl("rect", {
        class: "bucket-hit" + (state.selected === b.key ? " is-sel" : ""),
        x: M.left + i * slotW + 1, y: M.top, width: Math.max(slotW - 2, 2), height: plotH, rx: 4,
      });
      hit.addEventListener("mousemove", (e) => {
        const rows = accts
          .filter((a) => b.counts.get(a.key))
          .map((a) => `<div class="tt-row"><span class="swatch" style="background:${colorOf(a)}"></span>${a.label}<b>${b.counts.get(a.key)}</b></div>`)
          .join("");
        showTooltip(e, `<div class="tt-head">${fmtBucketLong(b.key)}</div>${rows || '<div class="tt-row">No posts</div>'}<div class="tt-row tt-total">Total<b>${b.total}</b></div>`);
      });
      hit.addEventListener("mouseleave", hideTooltip);
      hit.addEventListener("click", () => {
        state.selected = b.key;
        state.pinned = true;           // stop auto-following the newest period
        if (state.scope === "all") { state.scope = "month"; syncScopeButtons(); }
        hideTooltip(); render();
      });
      svg.appendChild(hit);

      // unmistakable marker for the period every other panel is reporting on
      if (state.selected === b.key) {
        svg.appendChild(svgEl("rect", {
          x: cx - barW / 2, y: M.top + plotH + 3, width: barW, height: 2.5, rx: 1.25,
          fill: cssVar("--accent"),
        }));
      }

      // stacked segments, 2px surface gap between them, 4px rounded top on the cap
      let acc = 0;
      const stack = accts.filter((a) => b.counts.get(a.key));
      stack.forEach((a, idx) => {
        const v = b.counts.get(a.key);
        const yTop = y(acc + v);
        const hRaw = y(acc) - yTop;
        const isCap = idx === stack.length - 1;
        const h = Math.max(hRaw - (idx === 0 ? 0 : 2), 1);
        svg.appendChild(svgEl("rect", {
          class: "seg-rect", x: cx - barW / 2, y: yTop, width: barW, height: h,
          rx: isCap ? Math.min(4, barW / 2) : 0, fill: colorOf(a),
        }));
        acc += v;
      });
    });

    host.appendChild(svg);
  }

  function renderAccounts() {
    const host = document.getElementById("chart-accounts");
    host.innerHTML = "";
    const posts = selectedPosts();
    const totals = new Map();
    for (const p of posts) totals.set(p.acct.key, (totals.get(p.acct.key) || 0) + 1);

    const rows = visibleAccounts()
      .map((a) => ({ acct: a, n: totals.get(a.key) || 0 }))
      .sort((x, z) => z.n - x.n);

    if (!rows.length || rows.every((r) => r.n === 0)) {
      host.innerHTML = `<div class="msg">No posts in this period.</div>`;
      return;
    }

    const W = Math.max(host.clientWidth || 460, 280);
    const rowH = 30, gap = 8;
    const H = rows.length * (rowH + gap);
    const labelW = 132, valW = 42;
    const trackW = Math.max(W - labelW - valW - 8, 40);
    const max = Math.max(...rows.map((r) => r.n), 1);

    const svg = svgEl("svg", {
      class: "chart", viewBox: `0 0 ${W} ${H}`, width: "100%", height: H,
      role: "img", "aria-label": "Bar chart of post totals by account",
    });

    rows.forEach((r, i) => {
      const yTop = i * (rowH + gap);
      const label = svgEl("text", { x: 0, y: yTop + rowH / 2 + 3 });
      label.textContent = r.acct.label;
      svg.appendChild(label);

      const w = Math.max((r.n / max) * trackW, r.n > 0 ? 3 : 0);
      const isSolo = state.hidden.size > 0 && !state.hidden.has(r.acct.key);

      svg.appendChild(svgEl("rect", {
        x: labelW, y: yTop + 5, width: trackW, height: rowH - 10, rx: 4,
        fill: "rgba(255,255,255,0.04)", "pointer-events": "none",
      }));
      svg.appendChild(svgEl("rect", {
        class: "seg-rect", x: labelW, y: yTop + 5, width: w, height: rowH - 10,
        rx: Math.min(4, (rowH - 10) / 2), fill: colorOf(r.acct), "pointer-events": "none",
      }));

      // direct value label — also the relief for sub-3:1 hues
      const val = svgEl("text", {
        class: "val-label", x: W, y: yTop + rowH / 2 + 3, "text-anchor": "end", "pointer-events": "none",
      });
      val.textContent = r.n;
      svg.appendChild(val);

      // marks are decoration; one row-wide target owns hover and click
      const hit = svgEl("rect", {
        class: "bucket-hit" + (isSolo ? " is-sel" : ""),
        x: 0, y: yTop, width: W, height: rowH, rx: 4,
      });
      hit.addEventListener("mousemove", (e) => {
        const pct = posts.length ? Math.round((r.n / posts.length) * 100) : 0;
        showTooltip(e, `<div class="tt-head">${r.acct.label}</div><div class="tt-row"><span class="swatch" style="background:${colorOf(r.acct)}"></span>${r.acct.channel}<b>${r.n}</b></div><div class="tt-row tt-total">Share<b>${pct}%</b></div><div class="tt-row" style="color:var(--faint)">${isSolo ? "click to show all" : "click to filter to this account"}</div>`);
      });
      hit.addEventListener("mouseleave", hideTooltip);
      hit.addEventListener("click", () => {
        state.hidden = isSolo
          ? new Set()
          : new Set([...ACCOUNTS, OTHER].map((a) => a.key).filter((k) => k !== r.acct.key));
        hideTooltip(); render();
      });
      svg.appendChild(hit);
    });

    host.appendChild(svg);
  }

  function renderHeatmap() {
    const host = document.getElementById("chart-heat");
    host.innerHTML = "";
    const posts = selectedPosts();
    if (!posts.length) { host.innerHTML = `<div class="msg">No posts in this period.</div>`; return; }

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
    for (const p of posts) grid[(p.ts.getDay() + 6) % 7][p.ts.getHours()]++;
    const max = Math.max(...grid.flat(), 1);

    const W = Math.max(host.clientWidth || 460, 280);
    const left = 34, top = 16, cellGap = 0;
    const cw = (W - left) / 24;
    const ch = 20;
    const H = top + 7 * ch + 6;

    const svg = svgEl("svg", {
      class: "chart", viewBox: `0 0 ${W} ${H}`, width: "100%", height: H,
      role: "img", "aria-label": "Heatmap of posting activity by weekday and hour, local time",
    });

    for (let h = 0; h < 24; h += 3) {
      const t = svgEl("text", { x: left + h * cw + cw / 2, y: 10, "text-anchor": "middle" });
      t.textContent = String(h).padStart(2, "0");
      svg.appendChild(t);
    }

    grid.forEach((row, d) => {
      const label = svgEl("text", { x: 0, y: top + d * ch + ch / 2 + 3 });
      label.textContent = DAYS[d];
      svg.appendChild(label);

      row.forEach((n, h) => {
        // sequential: one hue (deck accent), intensity ∝ magnitude
        const alpha = n === 0 ? 0.035 : 0.16 + 0.84 * (n / max);
        const cell = svgEl("rect", {
          class: "heat-cell", x: left + h * cw, y: top + d * ch,
          width: Math.max(cw - cellGap, 1), height: ch - cellGap, rx: 3,
          fill: n === 0 ? EMPTY_CELL : heatFill(alpha.toFixed(3)),
        });
        cell.addEventListener("mousemove", (e) =>
          showTooltip(e, `<div class="tt-head">${DAYS[d]} · ${String(h).padStart(2, "0")}:00</div><div class="tt-row">Posts<b>${n}</b></div>`)
        );
        cell.addEventListener("mouseleave", hideTooltip);
        svg.appendChild(cell);
      });
    });

    host.appendChild(svg);

    const scale = document.createElement("div");
    scale.className = "heat-scale";
    scale.style.marginTop = "10px";
    scale.innerHTML =
      `<span>Less</span><span class="ramp">` +
      [0, 0.25, 0.45, 0.65, 0.85, 1].map((a) =>
        `<i style="background:${a === 0 ? EMPTY_CELL : heatFill(a)}"></i>`).join("") +
      `</span><span>More · peak ${max}</span>`;
    host.appendChild(scale);
  }

  function renderTable() {
    const host = document.getElementById("table");
    const posts = selectedPosts();
    const totals = new Map();
    const lastSeen = new Map();
    for (const p of posts) {
      totals.set(p.acct.key, (totals.get(p.acct.key) || 0) + 1);
      if (!lastSeen.has(p.acct.key) || p.ts > lastSeen.get(p.acct.key)) lastSeen.set(p.acct.key, p.ts);
    }
    const firsts = firstSeen();
    const rows = visibleAccounts()
      .map((a) => ({ acct: a, n: totals.get(a.key) || 0, last: lastSeen.get(a.key), first: firsts.get(a.key) }))
      .sort((x, z) => z.n - x.n);
    const total = rows.reduce((s, r) => s + r.n, 0);

    const days = Math.max(
      1,
      state.selected
        ? (state.granularity === "week" ? 7 : 30)
        : Math.ceil((state.posts[state.posts.length - 1].ts - state.posts[0].ts) / 864e5) || 1
    );

    host.innerHTML = `
      <table>
        <thead><tr>
          <th>Account</th><th>Channel</th>
          <th class="num">Posts</th><th class="num">Share</th>
          <th class="num">Per day</th><th>First seen</th><th>Latest</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `
            <tr>
              <td class="name"><span class="swatch" style="background:${colorOf(r.acct)}"></span>${r.acct.label}</td>
              <td>${r.acct.channel}</td>
              <td class="num">${r.n}</td>
              <td class="num">${total ? Math.round((r.n / total) * 100) : 0}%</td>
              <td class="num">${(r.n / days).toFixed(1)}</td>
              <td>${r.first ? r.first.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—"}</td>
              <td>${r.last ? r.last.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"}</td>
            </tr>`).join("")}
        </tbody>
        <tfoot><tr>
          <td class="name">Total</td><td></td>
          <td class="num">${total}</td><td class="num">100%</td>
          <td class="num">${(total / days).toFixed(1)}</td><td></td><td></td>
        </tr></tfoot>
      </table>`;
  }

  /**
   * Tweet-published → landed-in-Discord, for posts in the current period.
   * Reported as a median: a single stalled post shouldn't move the headline.
   */
  function notifyLatency(posts) {
    const secs = [];
    for (const p of posts) {
      const delivered = state.deliveries.get(p.id);
      if (!delivered) continue;
      const s = (delivered - p.ts.getTime()) / 1000;
      if (s > 0 && s < 24 * 3600) secs.push(s);
    }
    if (!secs.length) return null;
    secs.sort((a, b) => a - b);
    return { median: secs[Math.floor(secs.length / 2)], n: secs.length };
  }

  function fmtDuration(s) {
    if (s < 60) return `${Math.round(s)}s`;
    if (s < 3600) return `${(s / 60).toFixed(1)}m`;
    return `${(s / 3600).toFixed(1)}h`;
  }

  /** Every tile reports on the period the controls are showing, not a fixed window. */
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const MAX_LOG_ROWS = 60;

  /** Newest-first log of what was actually relayed, for the current period. */
  function renderLog() {
    const host = document.getElementById("log");
    const note = document.getElementById("log-note");

    if (!state.log.size) {
      host.innerHTML = `<div class="msg">No post log published yet — it fills in as the relay posts.</div>`;
      note.textContent = "";
      return;
    }

    const rows = selectedPosts()
      .filter((p) => state.log.has(p.id))
      .map((p) => ({ post: p, row: state.log.get(p.id) }))
      .sort((a, b) => b.post.ts - a.post.ts);

    note.textContent = rows.length > MAX_LOG_ROWS
      ? `newest ${MAX_LOG_ROWS} of ${rows.length}`
      : `${rows.length} post${rows.length === 1 ? "" : "s"}`;

    if (!rows.length) {
      host.innerHTML = `<div class="msg">No logged posts in this period.<br>
        <span style="font-size:12px">The log covers recent posts; older ones predate it.</span></div>`;
      return;
    }

    host.innerHTML = `
      <table>
        <thead><tr>
          <th>When</th><th>Account</th><th>Post</th><th class="num">Notified in</th>
        </tr></thead>
        <tbody>
          ${rows.slice(0, MAX_LOG_ROWS).map(({ post, row }) => {
            const delivered = state.deliveries.get(post.id);
            const lat = delivered ? (delivered - post.ts.getTime()) / 1000 : null;
            const via = row.author
              ? `<div style="font-size:11px;color:var(--faint)">↻ reposted from @${escapeHtml(row.author)}</div>`
              : "";
            const img = row.img ? ` <span style="color:var(--faint)">· ${row.img} 🖼</span>` : "";
            const text = row.text
              ? escapeHtml(row.text)
              : `<span style="color:var(--faint)">no text captured</span>`;
            return `
              <tr>
                <td style="white-space:nowrap">${post.ts.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
                <td class="name" style="white-space:nowrap"><span class="swatch" style="background:${colorOf(post.acct)}"></span>${post.acct.label}${via}</td>
                <td>${text}${img}${row.url ? ` <a href="${escapeHtml(row.url)}" target="_blank" rel="noopener noreferrer">View&nbsp;↗</a>` : ""}</td>
                <td class="num" style="white-space:nowrap">${lat !== null && lat > 0 ? fmtDuration(lat) : "—"}</td>
              </tr>`;
          }).join("")}
        </tbody>
      </table>`;
  }

  function renderStats() {
    const host = document.getElementById("stats");
    const all = state.posts.filter((p) => !state.hidden.has(p.acct.key));
    if (!all.length) { host.innerHTML = ""; return; }

    const posts = selectedPosts();
    const days = periodDays();

    // headline label follows the scope
    const periodLabel = !state.selected ? "Posts · all time"
      : state.granularity === "week" ? "Posts · week" : "Posts · month";

    // change vs. the equivalent previous period (only meaningful when focused)
    let deltaHtml = !state.selected
      ? `over ${days} days`
      : fmtBucket(state.selected);
    if (state.selected) {
      const prevKey = prevBucketKey(state.selected);
      const prevN = state.posts.filter(
        (p) => !state.hidden.has(p.acct.key) && bucketKey(p.ts) === prevKey
      ).length;
      const unit = state.granularity === "week" ? "week" : "month";
      if (prevN > 0) {
        const delta = Math.round(((posts.length - prevN) / prevN) * 100);
        deltaHtml = `<span class="delta ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}%</span> vs. prev ${unit}`;
      } else {
        deltaHtml = `no posts in prev ${unit}`;
      }
    }

    const totals = new Map();
    for (const p of posts) totals.set(p.acct.key, (totals.get(p.acct.key) || 0) + 1);
    let busiest = null;
    for (const a of visibleAccounts()) {
      const n = totals.get(a.key) || 0;
      if (!busiest || n > busiest.n) busiest = { acct: a, n };
    }
    const activeCount = [...totals.values()].filter((n) => n > 0).length;

    const lat = notifyLatency(posts);

    host.innerHTML = `
      <div class="stat"><div class="label">${periodLabel}</div><div class="value">${posts.length}</div><div class="sub">${deltaHtml}</div></div>
      <div class="stat"><div class="label">Time to notify</div><div class="value">${lat ? fmtDuration(lat.median) : "—"}</div><div class="sub">${lat ? `median of ${lat.n} post${lat.n === 1 ? "" : "s"}` : "no timing data"}</div></div>
      <div class="stat"><div class="label">Posts per day</div><div class="value">${(posts.length / days).toFixed(1)}</div><div class="sub">across ${days} day${days === 1 ? "" : "s"}</div></div>
      <div class="stat"><div class="label">Busiest account</div><div class="value" style="font-size:15px">${busiest && busiest.n ? busiest.acct.label : "—"}</div><div class="sub">${busiest && busiest.n ? busiest.n + " posts" : "no posts"}</div></div>
      <div class="stat"><div class="label">Active accounts</div><div class="value">${activeCount}</div><div class="sub">of ${visibleAccounts().length} shown</div></div>`;
  }

  function renderChips() {
    const host = document.getElementById("chiprow");
    if (state.error) {
      host.innerHTML = `<span class="chip down"><span class="dot"></span> Data unavailable</span>`;
      return;
    }
    const latest = state.posts.length ? state.posts[state.posts.length - 1].ts : null;
    const mins = latest ? Math.round((Date.now() - latest) / 60000) : null;
    const ago = mins === null ? "—" : mins < 60 ? `${mins}m ago` : mins < 1440 ? `${Math.round(mins / 60)}h ago` : `${Math.round(mins / 1440)}d ago`;
    const synced = state.fetchedAt ? state.fetchedAt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "—";
    host.innerHTML = `
      <span class="chip ok"><span class="dot"></span> Relay live</span>
      <span class="chip"><span class="dot"></span> Accounts <b>${visibleAccounts().length}</b></span>
      <span class="chip"><span class="dot"></span> Posts <b>${state.posts.length}</b></span>
      <span class="chip"><span class="dot"></span> Latest post <b>${ago}</b></span>
      <span class="chip"><span class="dot"></span> Synced <b>${synced}</b></span>`;
  }

  function renderLegend() {
    const host = document.getElementById("legend");
    const present = [...ACCOUNTS, OTHER].filter((a) => state.posts.some((p) => p.acct.key === a.key));
    host.innerHTML = "";
    for (const a of present) {
      const btn = document.createElement("button");
      const on = !state.hidden.has(a.key);
      btn.setAttribute("aria-pressed", String(on));
      btn.innerHTML = `<span class="swatch" style="background:${colorOf(a)}"></span>${a.label}`;
      btn.title = on ? `Hide ${a.label}` : `Show ${a.label}`;
      btn.addEventListener("click", () => {
        if (on) state.hidden.add(a.key); else state.hidden.delete(a.key);
        render();
      });
      host.appendChild(btn);
    }
  }

  function renderNotes() {
    // Accounts joined the relay at different times, so earlier periods cover
    // fewer of them — say so rather than letting the ramp read as growth.
    const firsts = [...firstSeen().entries()]
      .map(([key, ts]) => ({ acct: [...ACCOUNTS, OTHER].find((a) => a.key === key), ts }))
      .filter((x) => x.acct)
      .sort((a, b) => a.ts - b.ts);
    const late = firsts.slice(1).filter((x) => x.ts - firsts[0].ts > 14 * 864e5);
    const note = document.getElementById("coverage-note");
    note.textContent = late.length
      ? `Coverage note: accounts joined the relay at different times — ${late
          .map((x) => `${x.acct.label} from ${x.ts.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`)
          .join(", ")}. Earlier periods therefore track fewer accounts, so the rise is partly added coverage, not only more posting.`
      : "";

    const sel = document.getElementById("sel-note");
    const acct = document.getElementById("acct-note");
    const tbl = document.getElementById("table-note");
    const scope = state.selected ? fmtBucketLong(state.selected) : "All time";
    sel.textContent = state.selected
      ? `${scope} — click any column to change period`
      : "All time — click a column to focus one period";
    acct.textContent = scope;
    tbl.textContent = scope;
  }

  function render() {
    if (state.error) {
      renderChips();
      document.getElementById("chart-time").innerHTML =
        `<div class="msg">Couldn't load data — ${state.error}.<br><code>${DATA_URL}</code></div>`;
      return;
    }
    if (!state.posts.length) return;
    renderChips(); renderLegend(); renderStats(); renderNotes();
    renderTimeline(); renderAccounts(); renderHeatmap(); renderTable(); renderLog();
  }

  // ---------------------------------------------------------------- wiring
  async function refresh({ bustCache = false } = {}) {
    try {
      const { posts, deliveries, log } = await load({ bustCache });
      state.posts = posts;
      state.deliveries = deliveries;
      state.log = log;
      state.fetchedAt = new Date();
      state.error = null;
      applyScope();   // follow the newest period unless the user pinned one
    } catch (err) {
      state.error = err.message || String(err);
    }
    render();
  }

  const SCOPES = { week: "btn-week", month: "btn-month", all: "btn-all" };
  for (const [scope, id] of Object.entries(SCOPES)) {
    document.getElementById(id).addEventListener("click", () => setScope(scope));
  }

  /**
   * Weekly/Monthly focus the newest period so every panel reports on it;
   * All time clears the focus. Timeline buckets monthly in "all" mode.
   */
  function setScope(scope) {
    if (state.scope === scope) return;
    state.scope = scope;
    state.pinned = false;
    applyScope();
    syncScopeButtons();
    render();
  }

  /** Derive bucket size + focused period from the current scope. */
  function applyScope() {
    state.granularity = state.scope === "all" ? "month" : state.scope;
    if (state.scope === "all") state.selected = null;
    else if (!state.pinned || !state.selected) state.selected = latestBucketKey();
  }

  function syncScopeButtons() {
    for (const [s, id] of Object.entries(SCOPES)) {
      document.getElementById(id).setAttribute("aria-pressed", String(s === state.scope));
    }
  }

  // Hold the element in a local: `e.currentTarget` is null by the time the
  // promise settles, which would leave the button permanently disabled.
  const refreshBtn = document.getElementById("btn-refresh");
  refreshBtn.addEventListener("click", () => {
    refreshBtn.disabled = true;
    refresh({ bustCache: true }).finally(() => { refreshBtn.disabled = false; });
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  // Periodic re-read of the published data files. Read-only and client-side —
  // it cannot collide with the relay's own runs.
  setInterval(() => { if (!document.hidden) refresh(); }, AUTO_REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state.fetchedAt && Date.now() - state.fetchedAt > AUTO_REFRESH_MS) refresh();
  });

  refresh();
})();
</script>
</body>
</html>
