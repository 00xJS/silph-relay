name: Relay Watchdog

on:
  # PRIMARY: every relay dispatch also starts a watchdog run. `requested`
  # fires when the relay run is *created*, so this keeps firing while a stuck
  # run holds the relay's concurrency group — exactly when it's needed.
  # It costs one short run per minute (public repo: free).
  workflow_run:
    workflows: ["PokeUpdates Bot"]
    types: [requested]
  workflow_dispatch:          # manual, or a cron-job.org job if one exists
  schedule:
    - cron: "*/30 * * * *"   # Backstop only — GitHub's cron fires a handful of times a day at best

permissions:
  actions: write              # to cancel stuck relay runs
  contents: read

# Deliberately NO concurrency group: nothing may queue this behind a stuck run,
# which is the whole point. Overlapping watchdog runs are harmless.

jobs:
  unstick:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: src
          show-progress: false

      - name: Cancel stuck relay runs, check the fallback
        env:
          GITHUB_TOKEN:             ${{ github.token }}
          NITTER_BASE:              ${{ vars.NITTER_BASE }}
          HEALTHCHECK_URL:          ${{ secrets.HEALTHCHECK_URL }}
          HEALTHCHECK_FALLBACK_URL: ${{ secrets.HEALTHCHECK_FALLBACK_URL }}
          DISCORD_WEBHOOK_URL:      ${{ secrets.DISCORD_WEBHOOK_URL }}   # stall / recovery notices (src/alerts.py)
        run: python3 -u src/watchdog.py
