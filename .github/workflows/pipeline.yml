name: PokeUpdates Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # Backstop only — GitHub's cron is best-effort and often hours late
  workflow_dispatch:          # PRIMARY trigger: cron-job.org calls this via the GitHub API every few minutes

permissions:
  contents: write             # Needed to commit seen_ids.json back to the repo

concurrency:
  group: pokeupdates-bot      # Never overlap runs — each one pushes to the repo
  cancel-in-progress: false

jobs:
  post-updates:
    runs-on: ubuntu-24.04
    # A hung run would hold the concurrency group and stall every later
    # dispatch — fail fast instead
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          RSSHUB_URL:                    ${{ secrets.RSSHUB_URL }}
          RSSHUB_ACCESS_KEY:             ${{ secrets.RSSHUB_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL:           ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_RESTOCKS:  ${{ secrets.DISCORD_WEBHOOK_URL_RESTOCKS }}
        run: python src/main.py

      - name: Publish updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python src/commit_data.py
