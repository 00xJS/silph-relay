[build]
  # Static single-file dashboard — nothing to compile.
  publish = "dashboard"

  # The relay commits data/ many times a day. Those commits must NOT trigger a
  # rebuild: the page reads its data at runtime from GitHub, so the deployed
  # files are identical either way. Build only when the site itself changes.
  # (exit 0 = nothing changed = skip the build; non-zero = build)
  # Compare against the last commit Netlify built, not just HEAD^: a push of
  # several commits whose last one doesn't touch the site must still deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- dashboard netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
